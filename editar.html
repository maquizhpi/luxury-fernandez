<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar catalogo - Luxury Fernandez</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111;
    --muted: #746f68;
    --line: rgba(17,17,17,0.12);
    --paper: #f7f3ec;
    --white: #fff;
  }

  * { box-sizing: border-box; }

  body {
    min-height: 100vh;
    margin: 0;
    display: grid;
    place-items: center;
    background: var(--paper);
    color: var(--ink);
    font-family: Montserrat, sans-serif;
    padding: 20px;
  }

  main {
    width: min(420px, 100%);
    background: var(--white);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 30px;
  }

  h1 {
    margin: 0 0 8px;
    font-family: "Cormorant Garamond", serif;
    font-size: 38px;
    font-weight: 500;
    line-height: 1;
  }

  p {
    margin: 0 0 24px;
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
  }

  label {
    display: block;
    margin-bottom: 8px;
    color: var(--muted);
    font-size: 13px;
  }

  input {
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 999px;
    padding: 13px 15px;
    font: inherit;
    outline: none;
  }

  input:focus { border-color: var(--ink); }

  button {
    width: 100%;
    margin-top: 14px;
    border: 0;
    border-radius: 999px;
    background: var(--ink);
    color: #fff;
    cursor: pointer;
    font: inherit;
    font-weight: 600;
    padding: 13px 16px;
  }

  .link {
    display: block;
    margin-top: 14px;
    color: var(--muted);
    font-size: 13px;
    text-align: center;
    text-decoration: none;
  }

  .message {
    min-height: 20px;
    margin-top: 14px;
    color: #b42318;
    font-size: 13px;
  }
</style>
</head>
<body>
  <main>
    <h1>Modo edicion</h1>
    <p>Inicia sesion para abrir el catalogo con herramientas de administrador.</p>
    <form id="loginForm">
      <label for="password">Contrasena</label>
      <input id="password" type="password" autocomplete="current-password" required autofocus>
      <button type="submit">Entrar a editar</button>
      <div class="message" id="message"></div>
    </form>
    <a class="link" href="index.html">Volver al catalogo</a>
  </main>

<script>
const form = document.getElementById('loginForm');
const message = document.getElementById('message');

form.addEventListener('submit', async event => {
  event.preventDefault();
  message.textContent = '';

  try {
    const response = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value })
    });
    const data = await response.json().catch(() => ({}));
    if (!response.ok) throw new Error(data.error || 'No se pudo iniciar sesion.');

    localStorage.setItem('lf_admin_token', data.token);
    window.location.href = 'index.html?admin=1';
  } catch (error) {
    message.textContent = error.message;
  }
});
</script>
</body>
</html>
