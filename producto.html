<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detalle — Luxury Fernández</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Montserrat:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #9b7a2d;
    --gold-light: #d8c690;
    --black: #111111;
    --cream: #f7f3ec;
    --warm-gray: #77716a;
    --dark-bg: #f7f3ec;
    --card-bg: #ece6dc;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--cream);
    color: var(--black);
    font-family: 'Montserrat', sans-serif;
    font-weight: 300;
    min-height: 100svh;
  }

  /* ── TOP BAR ── */
  .top-bar {
    position: sticky;
    top: 0;
    z-index: 100;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 16px;
    background: var(--cream);
    border-bottom: 1px solid rgba(17,17,17,0.08);
  }
  .back-btn {
    display: flex;
    align-items: center;
    gap: 8px;
    background: none;
    border: none;
    cursor: pointer;
    color: var(--black);
    font-family: 'Montserrat', sans-serif;
    font-size: 11px;
    letter-spacing: 2px;
    text-transform: uppercase;
    text-decoration: none;
    padding: 6px 0;
  }
  .back-btn svg { width: 18px; height: 18px; }
  .top-bar-brand {
    font-family: 'Cormorant Garamond', serif;
    font-size: 17px;
    font-style: italic;
    color: var(--black);
    letter-spacing: 1px;
  }
  .top-bar-spacer { width: 60px; }

  /* ── PRODUCT IMAGE ── */
  .product-image-wrap {
    width: 100%;
    background: #ece8e1;
    aspect-ratio: 1 / 1;
    overflow: hidden;
    position: relative;
  }
  .product-image {
    width: 100%;
    height: 100%;
    object-fit: contain;
    display: block;
  }
  .product-tag {
    position: absolute;
    top: 16px;
    left: 16px;
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    padding: 6px 14px;
    font-weight: 600;
    font-family: 'Montserrat', sans-serif;
  }
  .tag-exclusivo { background: var(--gold); color: #fff; }
  .tag-destacado { background: #111; color: #fff; }
  .tag-nuevo { background: transparent; border: 1px solid var(--gold); color: var(--gold); }
  .tag-oferta { background: #e74c3c; color: #fff; }
  .tag-promocion { background: #25D366; color: #07140b; }
  .tag-vendido { background: #5f6b7a; color: #fff; }
  .tag-reservado { background: #8e44ad; color: #fff; }

  /* ── CONTENT ── */
  .product-content {
    padding: 28px 20px 120px;
    max-width: 600px;
    margin: 0 auto;
  }
  .product-category {
    font-size: 9px;
    letter-spacing: 5px;
    text-transform: uppercase;
    color: var(--warm-gray);
    margin-bottom: 10px;
    font-weight: 500;
  }
  .product-name {
    font-family: 'Cormorant Garamond', serif;
    font-size: 32px;
    font-weight: 400;
    color: var(--black);
    line-height: 1.15;
    margin-bottom: 6px;
  }
  .product-brand {
    font-size: 11px;
    letter-spacing: 3px;
    color: var(--warm-gray);
    text-transform: uppercase;
    margin-bottom: 22px;
  }
  .product-divider {
    height: 1px;
    background: linear-gradient(90deg, var(--gold), transparent);
    margin-bottom: 22px;
  }
  .product-desc {
    font-size: 14px;
    line-height: 1.85;
    color: #4a4540;
    margin-bottom: 28px;
  }
  .product-price {
    font-family: 'Cormorant Garamond', serif;
    font-size: 34px;
    font-weight: 600;
    color: var(--gold);
    margin-bottom: 28px;
    letter-spacing: -0.5px;
  }

  /* ── WHATSAPP BUTTON ── */
  .whatsapp-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 12px;
    background: #25D366;
    color: #fff;
    padding: 17px 22px;
    text-decoration: none;
    font-size: 11px;
    letter-spacing: 3px;
    text-transform: uppercase;
    font-family: 'Montserrat', sans-serif;
    font-weight: 500;
    width: 100%;
    border: none;
    cursor: pointer;
    transition: background 0.2s;
    margin-bottom: 20px;
    border-radius: 2px;
  }
  .whatsapp-btn:hover { background: #1aab52; }
  .whatsapp-btn svg { width: 20px; height: 20px; flex-shrink: 0; }

  /* ── SHARE ── */
  .share-section {
    padding-top: 20px;
    border-top: 1px solid rgba(17,17,17,0.1);
  }
  .share-label {
    font-size: 9px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--warm-gray);
    margin-bottom: 14px;
    display: block;
  }
  .share-row {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
  }
  .share-btn {
    width: 46px;
    height: 46px;
    border-radius: 50%;
    border: none;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: transform 0.2s, opacity 0.2s;
  }
  .share-btn:hover { transform: scale(1.1); }
  .share-btn svg { width: 19px; height: 19px; }
  .share-fb { background: #1877F2; color: #fff; }
  .share-wa { background: #25D366; color: #fff; }
  .share-ig { background: linear-gradient(45deg,#f09433,#e6683c,#dc2743,#cc2366,#bc1888); color: #fff; }
  .share-copy { background: rgba(155,122,45,0.15); color: var(--gold); border: 1px solid rgba(155,122,45,0.3) !important; }

  /* ── STICKY BOTTOM ── */
  .sticky-bottom {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    z-index: 200;
    padding: 12px 16px calc(12px + env(safe-area-inset-bottom));
    background: var(--cream);
    border-top: 1px solid rgba(17,17,17,0.1);
    backdrop-filter: blur(12px);
  }
  .sticky-bottom .whatsapp-btn { margin-bottom: 0; }

  /* ── LOADING ── */
  .loading-wrap {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60svh;
    gap: 16px;
  }
  .loading-dot {
    width: 8px; height: 8px;
    background: var(--gold);
    border-radius: 50%;
    animation: pulse 1.2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 0.3; transform: scale(0.8); }
    50% { opacity: 1; transform: scale(1.2); }
  }
  .loading-text {
    font-size: 11px;
    letter-spacing: 4px;
    text-transform: uppercase;
    color: var(--warm-gray);
  }

  /* ── NOT FOUND ── */
  .not-found {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 60svh;
    gap: 14px;
    padding: 40px 20px;
    text-align: center;
  }
  .not-found h2 {
    font-family: 'Cormorant Garamond', serif;
    font-size: 26px;
    color: var(--warm-gray);
    font-style: italic;
  }
  .not-found a {
    font-size: 10px;
    letter-spacing: 3px;
    text-transform: uppercase;
    color: var(--gold);
    text-decoration: none;
    border-bottom: 1px solid var(--gold);
    padding-bottom: 2px;
  }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 90px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #111;
    color: #fff;
    padding: 10px 20px;
    font-size: 11px;
    letter-spacing: 2px;
    border-radius: 2px;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    pointer-events: none;
    white-space: nowrap;
    z-index: 9999;
  }
  .toast.visible {
    opacity: 1;
    transform: translateX(-50%) translateY(0);
  }

  /* ── IMAGE GALLERY ── */
  .img-gallery {
    display: flex; gap: 6px; padding: 10px 16px;
    background: #e4ddd3; overflow-x: auto; -webkit-overflow-scrolling: touch;
  }
  .img-thumb {
    width: 58px; height: 58px; flex-shrink: 0;
    object-fit: cover; cursor: pointer; border-radius: 3px;
    border: 2px solid transparent; opacity: 0.65;
    transition: opacity .15s, border-color .15s;
  }
  .img-thumb.active, .img-thumb:hover { border-color: var(--gold); opacity: 1; }

  /* ── FADE IN ── */
  .product-detail { animation: fadeIn 0.4s ease; }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(12px); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>

const TAG_LABELS = {
  nuevo: 'Nuevo', destacado: 'Destacado', exclusivo: 'Exclusivo',
  oferta: 'Oferta', promocion: 'Promoción', reservado: 'Reservado', vendido: 'Vendido'
};

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('visible');
  setTimeout(() => t.classList.remove('visible'), 2800);
}

function buildWALink(p) {
  const msg = encodeURIComponent(`Hola! Me interesa: *${p.name}* de ${p.brand}. Precio: ${p.price}. ¿Puedes darme más información? Gracias!`);
  return `https://wa.me/${WA}?text=${msg}`;
}

function share(platform, p, idx) {
  const url = `${SITE_URL}/producto.html?idx=${idx}`;
  const text = `${p.name} — ${p.brand} | Luxury Fernández`;
  if (platform === 'facebook') {
    window.open(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(url)}`, '_blank');
  } else if (platform === 'whatsapp') {
    window.open(`https://wa.me/?text=${encodeURIComponent(text + '\n' + url)}`, '_blank');
  } else if (platform === 'instagram') {
    navigator.clipboard.writeText(url).then(() => showToast('Enlace copiado — pégalo en Instagram'));
  } else if (platform === 'copy') {
    navigator.clipboard.writeText(url).then(() => showToast('Enlace copiado'));
  }
}

function showNotFound() {
  document.getElementById('main').innerHTML = `
    <div class="not-found">
      <h2>Producto no encontrado</h2>
      <a href="index.html">Volver al catálogo</a>
    </div>
  `;
}

async function init() {
  const params = new URLSearchParams(window.location.search);
  const idx = parseInt(params.get('idx'));

  if (isNaN(idx) || idx < 0) {
    showNotFound();
    return;
  }

  // Try to load from API to get any edits/overrides
  try {
    const res = await fetch(`${API_BASE}/api/catalogos`);
    if (res.ok) {
      const mongoProducts = await res.json();
      mongoProducts.forEach(mp => {
        if (Number.isInteger(mp.sourceId) && mp.sourceId >= 0 && mp.sourceId < products.length) {
          Object.assign(products[mp.sourceId], mp);
        }
      });
    }
  } catch (_) {}

  const p = products[idx];
  if (!p) {
    showNotFound();
    return;
  }

  renderProduct(p, idx);
}

init();
