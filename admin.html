<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Luxury Fernández</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root {
  --ink: #111;
  --muted: #746f68;
  --line: rgba(17,17,17,0.12);
  --paper: #f7f3ec;
  --white: #fff;
  --danger: #b42318;
  --success: #1a7a3f;
  --blue: #2a5298;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--paper); color: var(--ink); font-family: Montserrat, sans-serif; font-size: 14px; }

/* ── HEADER ── */
header {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  padding: 14px 24px; background: var(--white); border-bottom: 1px solid var(--line);
  position: sticky; top: 0; z-index: 100;
}
.header-title { font-family: "Cormorant Garamond", serif; font-size: 26px; font-weight: 500; }
.header-actions { display: flex; gap: 8px; align-items: center; }

/* ── BOTONES ── */
.btn {
  display: inline-flex; align-items: center; gap: 6px;
  border: 0; border-radius: 8px; cursor: pointer;
  font: 600 13px Montserrat, sans-serif; padding: 10px 18px;
  text-decoration: none; white-space: nowrap; transition: opacity .15s;
}
.btn:active { opacity: .75; }
.btn-primary  { background: var(--blue);    color: #fff; }
.btn-success  { background: var(--success); color: #fff; }
.btn-danger   { background: var(--danger);  color: #fff; }
.btn-ghost    { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn-back     { background: transparent; color: var(--muted); border: 0; padding: 10px 0; font-size: 13px; }
.btn-back:hover { color: var(--ink); }

/* ── TOAST ── */
#toast {
  position: fixed; top: 80px; left: 50%; transform: translateX(-50%) translateY(-20px);
  background: var(--success); color: #fff; font-size: 13px; font-weight: 600;
  padding: 10px 20px; border-radius: 8px; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
  opacity: 0; pointer-events: none; z-index: 200;
  transition: opacity .25s, transform .25s;
}
#toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
#toast.err  { background: var(--danger); }

/* ══════════════════════════════════
   VISTA 1 — CATÁLOGO
══════════════════════════════════ */
#viewCatalog { display: block; }

.toolbar {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 12px 24px; background: var(--white); border-bottom: 1px solid var(--line);
  position: sticky; top: 57px; z-index: 90;
}
.toolbar-search {
  flex: 1; min-width: 180px; max-width: 360px;
  border: 1px solid var(--line); border-radius: 8px;
  font: inherit; font-size: 14px; padding: 9px 13px;
  outline: none; background: #fafaf8; color: var(--ink);
}
.toolbar-search:focus { border-color: var(--ink); background: #fff; }
#countLabel { font-size: 12px; color: var(--muted); }

.cat-bar {
  display: flex; gap: 6px; overflow-x: auto; padding: 10px 24px;
  background: var(--white); border-bottom: 1px solid var(--line);
  position: sticky; top: 109px; z-index: 89;
  scrollbar-width: none;
}
.cat-bar::-webkit-scrollbar { display: none; }
.cat-pill {
  flex-shrink: 0; border: 1px solid var(--line); border-radius: 999px;
  background: #fff; color: var(--muted); font: 600 12px Montserrat, sans-serif;
  padding: 6px 16px; cursor: pointer; white-space: nowrap;
  transition: background .15s, color .15s, border-color .15s;
}
.cat-pill:hover   { border-color: var(--ink); color: var(--ink); }
.cat-pill.active  { background: var(--ink); color: #fff; border-color: var(--ink); }

.product-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(170px, 1fr));
  gap: 16px; padding: 20px 24px;
}

.product-card {
  background: var(--white); border: 1px solid var(--line);
  border-radius: 12px; overflow: hidden; cursor: pointer;
  transition: transform .18s, box-shadow .18s;
  display: flex; flex-direction: column;
}
.product-card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.product-card.is-hidden  { opacity: .55; }
.product-card.is-deleted { opacity: .35; }

.card-img { width: 100%; aspect-ratio: 3/4; object-fit: cover; background: #e8e4de; display: block; }
.card-img-ph {
  width: 100%; aspect-ratio: 3/4; background: #e8e4de;
  display: flex; align-items: center; justify-content: center;
}
.card-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 3px; }
.card-name { font-size: 12px; font-weight: 600; line-height: 1.35; }
.card-meta { font-size: 11px; color: var(--muted); }
.card-badge {
  align-self: flex-start; font-size: 10px; font-weight: 600; letter-spacing: .4px;
  padding: 2px 8px; border-radius: 999px; margin-top: 5px;
  background: #f5d0ce; color: var(--danger);
}
.card-badge.is-hidden-badge { background: #e0dcd6; color: var(--muted); }

/* ══════════════════════════════════
   VISTA 2 — EDITOR
══════════════════════════════════ */
#viewEditor { display: none; }

.editor-header {
  padding: 12px 24px; background: var(--white); border-bottom: 1px solid var(--line);
  position: sticky; top: 57px; z-index: 90;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
}
.editor-header-left { display: flex; align-items: center; gap: 16px; }
.editor-product-name { font-family: "Cormorant Garamond", serif; font-size: 20px; }
.editor-mode {
  font-size: 11px; font-weight: 600; letter-spacing: 1px;
  padding: 3px 10px; border-radius: 999px;
  background: #dff0e8; color: var(--success);
}
.editor-mode.new  { background: #dce8f5; color: var(--blue); }
.editor-header-actions { display: flex; gap: 8px; }

.editor-body { max-width: 720px; margin: 0 auto; padding: 28px 24px 60px; }

/* Imágenes */
.section-title { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .5px; text-transform: uppercase; margin-bottom: 12px; }
.img-slots { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
.img-slot-wrap { display: flex; flex-direction: column; align-items: center; gap: 5px; flex-shrink: 0; }
.img-slot {
  position: relative; width: 96px; height: 112px;
  border: 2px dashed #c9c5bf; border-radius: 10px;
  overflow: hidden; background: #faf8f5;
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: border-color .15s;
}
.img-slot:hover { border-color: var(--ink); }
.img-slot.filled { border: 2px solid var(--line); }
.img-slot img { width: 100%; height: 100%; object-fit: cover; }
.img-slot-ph {
  display: flex; flex-direction: column; align-items: center; gap: 5px;
  color: #b0a99f; font-size: 10px; pointer-events: none; text-align: center; padding: 8px;
}
.img-slot.filled .img-slot-ph { display: none; }
.img-slot-rm {
  position: absolute; top: 4px; right: 4px;
  width: 20px; height: 20px; border-radius: 50%;
  background: rgba(180,35,24,.9); color: #fff;
  border: none; font-size: 14px; line-height: 1;
  cursor: pointer; display: none; align-items: center; justify-content: center; padding: 0;
}
.img-slot.filled .img-slot-rm { display: flex; }
.img-slot-label { font-size: 10px; color: var(--muted); }

/* Campos */
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 24px; }
.field { display: flex; flex-direction: column; gap: 6px; }
.field.span2 { grid-column: 1 / -1; }
.field label { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .3px; }
.field input, .field select, .field textarea {
  border: 1px solid var(--line); border-radius: 8px;
  font: inherit; font-size: 14px; padding: 11px 13px;
  color: var(--ink); background: #fff; outline: none; -webkit-appearance: none;
  width: 100%;
}
.field input:focus, .field select:focus, .field textarea:focus { border-color: var(--ink); }
.field textarea { min-height: 110px; resize: vertical; line-height: 1.5; }

.checks { display: flex; gap: 24px; margin-top: 18px; flex-wrap: wrap; }
.checks label { display: flex; align-items: center; gap: 9px; cursor: pointer; font-size: 14px; }
.checks input[type=checkbox] { width: 17px; height: 17px; cursor: pointer; }

.form-actions {
  display: flex; gap: 10px; margin-top: 28px; padding-top: 20px;
  border-top: 1px solid var(--line);
}
.form-actions .btn { flex: 1; justify-content: center; padding: 13px; font-size: 14px; }

#statusMsg { margin-top: 12px; font-size: 13px; min-height: 20px; }
#statusMsg.ok  { color: var(--success); font-weight: 600; }
#statusMsg.err { color: var(--danger);  font-weight: 600; }

/* ── MOBILE ── */
@media (max-width: 640px) {
  header { padding: 10px 14px; flex-direction: column; align-items: stretch; gap: 8px; }
  .header-title { font-size: 22px; }
  .header-session { display: none; }
  .header-actions { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; }
  .btn-primary-new { grid-column: 1 / 2; justify-content: center; }
  .btn-ghost-sm, .btn-danger-sm { padding: 10px 14px; }

  .toolbar { padding: 10px 12px; top: 86px; }
  .toolbar-search { font-size: 16px; min-height: 46px; }
  .cat-bar { top: 144px; padding: 8px 12px; }

  .product-grid { grid-template-columns: repeat(2, 1fr); gap: 10px; padding: 12px; }

  .editor-header { top: 86px; padding: 10px 14px; flex-direction: column; align-items: flex-start; gap: 10px; }
  .editor-header-actions { width: 100%; }
  .editor-header-actions .btn { flex: 1; justify-content: center; }

  .editor-body { padding: 16px 14px 100px; }

  .field input, .field select, .field textarea { font-size: 16px; min-height: 46px; padding: 12px 14px; }
  .field textarea { min-height: 120px; }
  .fields { grid-template-columns: 1fr; gap: 14px; }

  .form-actions { flex-direction: column; }
  .form-actions .btn { padding: 15px; }

  .img-slot { width: 84px; height: 100px; }
}
</style>
</head>
<body>

<header>
  <span class="header-title">Productos</span>
  <div class="header-actions">
    <span id="sessionLabel" class="header-session" style="font-size:11px;color:var(--muted)"></span>
    <button class="btn btn-primary btn-primary-new" id="newBtn">+ Nuevo</button>
    <a class="btn btn-ghost btn-ghost-sm" href="/">Ver catálogo</a>
    <button class="btn btn-danger btn-danger-sm" id="logoutBtn">Salir</button>
  </div>
</header>

<div id="toast"></div>

<!-- ══ VISTA 1: CATÁLOGO ══ -->
<div id="viewCatalog">
  <div class="toolbar">
    <input class="toolbar-search" id="search" type="search" placeholder="Buscar producto...">
    <span id="countLabel">Cargando...</span>
  </div>
  <div class="cat-bar" id="catBar"></div>
  <div class="product-grid" id="productGrid"></div>
</div>

<!-- ══ VISTA 2: EDITOR ══ -->
<div id="viewEditor">
  <div class="editor-header">
    <div class="editor-header-left">
      <button class="btn btn-back" id="backBtn">← Volver</button>
      <span class="editor-product-name" id="editorTitle"></span>
      <span class="editor-mode" id="editorMode">Editando</span>
    </div>
    <div class="editor-header-actions">
      <button class="btn btn-success" id="saveHeaderBtn">Guardar</button>
      <button class="btn btn-danger" id="deleteHeaderBtn" style="display:none">Eliminar</button>
    </div>
  </div>

  <div class="editor-body">
    <form id="productForm" onsubmit="submitForm(event)">

      <div class="section-title">Imágenes (hasta 5) — toca para subir</div>
      <div class="img-slots" id="imgSlots"></div>

      <div class="fields">
        <div class="field">
          <label>Nombre *</label>
          <input type="text" id="fName" required placeholder="Ej: Bolso Cuero Negro">
        </div>
        <div class="field">
          <label>Marca *</label>
          <input type="text" id="fBrand" required placeholder="Ej: Gucci">
        </div>
        <div class="field">
          <label>Categoría</label>
          <select id="fCat">
            <option value="billetera">Billetera</option>
            <option value="cartera">Cartera</option>
            <option value="joya">Joya</option>
            <option value="gorra">Gorra</option>
            <option value="accesorio">Accesorio</option>
            <option value="ropa">Ropa Mujer</option>
            <option value="infantil">Infantil</option>
            <option value="figura">Figura Coleccionable</option>
          </select>
        </div>
        <div class="field">
          <label>Precio</label>
          <input type="text" id="fPrice" placeholder="Ej: $45">
        </div>
        <div class="field">
          <label>Etiqueta</label>
          <select id="fTag">
            <option value="">Sin etiqueta</option>
            <option value="nuevo">Nuevo</option>
            <option value="destacado">Destacado</option>
            <option value="exclusivo">Exclusivo</option>
            <option value="oferta">Oferta</option>
            <option value="promocion">Promoción</option>
            <option value="reservado">Reservado</option>
            <option value="vendido">Vendido</option>
          </select>
        </div>
        <div class="field span2">
          <label>Descripción</label>
          <textarea id="fDesc" placeholder="Descripción del producto..."></textarea>
        </div>
      </div>

      <div class="checks">
        <label><input type="checkbox" id="fVisible" checked> Visible en catálogo</label>
        <label><input type="checkbox" id="fDeleted"> Marcado como eliminado</label>
      </div>

      <div class="form-actions">
        <button type="submit" class="btn btn-success" id="submitBtn">Guardar cambios</button>
        <button type="button" class="btn btn-danger" id="deleteBtn" onclick="deleteProduct()" style="display:none">Eliminar producto</button>
      </div>
      <div id="statusMsg"></div>

    </form>
  </div>
</div>

<script>
/* ── AUTH ── */
const token = localStorage.getItem('lf_admin_token') || '';
if (!token) { window.location.href = 'editar.html'; }
document.getElementById('sessionLabel').textContent = 'Sesión: ' + (localStorage.getItem('lf_admin_user') || 'admin');

/* ── ESTADO ── */
let allProducts = [];
let current     = null;
let isNew       = false;
let slotData    = ['','','','',''];
let filterCat   = '';

const CATS = [
  { key: '',          label: 'Todos' },
  { key: 'billetera', label: 'Billeteras' },
  { key: 'cartera',   label: 'Carteras' },
  { key: 'joya',      label: 'Joyas' },
  { key: 'gorra',     label: 'Gorras' },
  { key: 'accesorio', label: 'Accesorios' },
  { key: 'ropa',      label: 'Ropa Mujer' },
  { key: 'infantil',  label: 'Infantil' },
  { key: 'figura',    label: 'Figuras' },
];

/* ── API ── */
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}`, ...(opts.headers || {}) },
    ...opts
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error en la solicitud.');
  return data;
}

/* ── TOAST ── */
let toastTimer;
function toast(msg, type = 'ok') {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.className = 'show' + (type === 'err' ? ' err' : '');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.className = ''; }, 2500);
}

/* ── VISTAS ── */
function showCatalog() {
  document.getElementById('viewCatalog').style.display = 'block';
  document.getElementById('viewEditor').style.display  = 'none';
}
function showEditor() {
  document.getElementById('viewCatalog').style.display = 'none';
  document.getElementById('viewEditor').style.display  = 'block';
  window.scrollTo(0, 0);
}

/* ── UTILIDADES ── */
function imgSrc(src) {
  if (!src) return '';
  if (/^(https?:|data:)/.test(src)) return src;
  return src.startsWith('/') ? src : '/' + src;
}

function normCat(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('billetera')) return 'billetera';
  if (c.includes('cartera'))   return 'cartera';
  if (c.includes('joya'))      return 'joya';
  if (c.includes('gorra'))     return 'gorra';
  if (c.includes('accesorio')) return 'accesorio';
  if (c.includes('ropa'))      return 'ropa';
  if (c.includes('infantil'))  return 'infantil';
  if (c.includes('figura'))    return 'figura';
  return c || 'cartera';
}

/* ── GRILLA ── */
function renderCatBar() {
  const bar = document.getElementById('catBar');
  bar.innerHTML = '';
  CATS.forEach(c => {
    const pill = document.createElement('button');
    pill.className = 'cat-pill' + (filterCat === c.key ? ' active' : '');
    pill.textContent = c.label;
    pill.addEventListener('click', () => { filterCat = c.key; renderCatBar(); renderGrid(); });
    bar.appendChild(pill);
  });
}

function renderGrid(q = '') {
  const grid  = document.getElementById('productGrid');
  const lower = (q || document.getElementById('search').value).trim().toLowerCase();
  const list  = allProducts.filter(p => {
    if (filterCat && normCat(p.cat) !== filterCat) return false;
    return !lower || [p.name, p.brand, p.cat].some(v => (v || '').toLowerCase().includes(lower));
  });
  document.getElementById('countLabel').textContent = list.length + ' de ' + allProducts.length + ' productos';
  grid.innerHTML = '';
  list.forEach(p => {
    const card = document.createElement('div');
    card.className = 'product-card' + (p.deleted ? ' is-deleted' : p.hidden ? ' is-hidden' : '');
    const src = imgSrc(p.img);
    const imgEl = src
      ? `<img class="card-img" src="${src}" alt="" loading="lazy" onerror="this.style.background='#d8d4ce'">`
      : `<div class="card-img-ph"><svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#b0a99f" stroke-width="1.5"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg></div>`;
    const badge = p.deleted
      ? '<span class="card-badge">eliminado</span>'
      : p.hidden ? '<span class="card-badge is-hidden-badge">oculto</span>' : '';
    card.innerHTML = imgEl + `<div class="card-body"><div class="card-name">${p.name || 'Sin nombre'}</div><div class="card-meta">${p.brand || ''}${p.price ? ' · ' + p.price : ''}</div>${badge}</div>`;
    card.addEventListener('click', () => openEditor(p));
    grid.appendChild(card);
  });
}

/* ── EDITOR ── */
function openEditor(p) {
  current = p;
  isNew   = false;
  populateForm(p);
  showEditor();
}

function openNew() {
  current  = null;
  isNew    = true;
  slotData = ['','','','',''];
  populateForm({ name:'', brand:'', cat:'cartera', price:'', tag:'', desc:'', img:'', images:[], hidden:false, deleted:false });
  showEditor();
}

function populateForm(p) {
  document.getElementById('editorTitle').textContent = isNew ? 'Nuevo producto' : (p.name || 'Sin nombre');
  const mode = document.getElementById('editorMode');
  mode.textContent = isNew ? 'Nuevo' : 'Editando';
  mode.className   = 'editor-mode' + (isNew ? ' new' : '');

  const imgs = (p.images && p.images.length) ? p.images : (p.img ? [p.img] : []);
  slotData = ['','','','',''];
  imgs.slice(0,5).forEach((u,i) => { slotData[i] = u || ''; });
  renderSlots();

  document.getElementById('fName').value    = p.name    || '';
  document.getElementById('fBrand').value   = p.brand   || '';
  document.getElementById('fCat').value     = normCat(p.cat);
  document.getElementById('fPrice').value   = (p.price && p.price !== 'Consultar precio') ? p.price : '';
  document.getElementById('fTag').value     = p.tag     || '';
  document.getElementById('fDesc').value    = p.desc    || '';
  document.getElementById('fVisible').checked = !p.hidden && !p.deleted;
  document.getElementById('fDeleted').checked = Boolean(p.deleted);

  document.getElementById('submitBtn').textContent      = isNew ? 'Agregar producto' : 'Guardar cambios';
  document.getElementById('deleteBtn').style.display    = isNew ? 'none' : '';
  document.getElementById('deleteHeaderBtn').style.display = isNew ? 'none' : '';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('statusMsg').className   = '';
}

/* ── SLOTS DE IMAGEN ── */
function renderSlots() {
  const container = document.getElementById('imgSlots');
  container.innerHTML = '';
  slotData.forEach((data, i) => {
    const wrap = document.createElement('div');
    wrap.className = 'img-slot-wrap';

    const slot = document.createElement('div');
    slot.className = 'img-slot' + (data ? ' filled' : '');

    if (data) {
      const img = document.createElement('img');
      img.src = imgSrc(data);
      slot.appendChild(img);
    }

    const ph = document.createElement('div');
    ph.className = 'img-slot-ph';
    ph.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="20" height="20"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>${i === 0 ? 'Principal' : 'Foto '+(i+1)}</span>`;
    slot.appendChild(ph);

    const rm = document.createElement('button');
    rm.type = 'button'; rm.className = 'img-slot-rm'; rm.textContent = '×';
    rm.addEventListener('click', e => { e.stopPropagation(); slotData[i]=''; renderSlots(); });
    slot.appendChild(rm);

    slot.addEventListener('click', () => pickImage(i));

    const lbl = document.createElement('div');
    lbl.className = 'img-slot-label';
    lbl.textContent = i === 0 ? '★ Principal' : 'Foto '+(i+1);

    wrap.appendChild(slot);
    wrap.appendChild(lbl);
    container.appendChild(wrap);
  });
}

function pickImage(i) {
  const inp = document.createElement('input');
  inp.type = 'file'; inp.accept = 'image/*'; inp.style.display = 'none';
  document.body.appendChild(inp);
  inp.addEventListener('change', async e => {
    const file = e.target.files[0];
    document.body.removeChild(inp);
    if (!file) return;
    setStatus('Procesando imagen...', '');
    slotData[i] = await resizeImage(file);
    renderSlots();
    setStatus('', '');
  });
  inp.click();
}

async function resizeImage(file, maxW = 900, quality = 0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxW) { h = Math.round(h * maxW / w); w = maxW; }
        const c = document.createElement('canvas');
        c.width = w; c.height = h;
        c.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(c.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function setStatus(msg, type) {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className   = type || '';
}

/* ── GUARDAR ── */
async function submitForm(e) {
  e.preventDefault();
  const images = slotData.filter(Boolean);
  const name   = document.getElementById('fName').value.trim();
  const brand  = document.getElementById('fBrand').value.trim();

  if (!name || !brand)     { setStatus('Nombre y marca son obligatorios.', 'err'); return; }
  if (isNew && !images[0]) { setStatus('Sube al menos la imagen principal.', 'err'); return; }

  setStatus('Guardando...', '');
  document.getElementById('submitBtn').disabled = true;

  const payload = {
    name, brand,
    cat:    document.getElementById('fCat').value,
    price:  document.getElementById('fPrice').value.trim() || 'Consultar precio',
    tag:    document.getElementById('fTag').value,
    desc:   document.getElementById('fDesc').value.trim(),
    hidden: !document.getElementById('fVisible').checked,
    deleted: document.getElementById('fDeleted').checked,
    img:    images[0] || (current?.img || ''),
    images
  };

  try {
    let saved;
    if (isNew) {
      saved = await api('/api/catalogos', { method: 'POST', body: JSON.stringify({ ...payload, isCustom: true }) });
      allProducts.unshift(saved);
    } else {
      const endpoint = current.sourceId !== undefined
        ? `/api/catalogos/source/${current.sourceId}`
        : `/api/catalogos/${current._id}`;
      saved = await api(endpoint, { method: 'PUT', body: JSON.stringify(payload) });
      allProducts = allProducts.map(p => p._id === saved._id ? saved : p);
    }
    renderGrid();
    toast('✓ Guardado correctamente');
    showCatalog();
  } catch (err) {
    setStatus(err.message, 'err');
  } finally {
    document.getElementById('submitBtn').disabled = false;
  }
}

/* ── ELIMINAR ── */
async function deleteProduct() {
  if (!current || isNew) return;
  if (!confirm(`¿Eliminar "${current.name || 'este producto'}" permanentemente?\nEsta acción no se puede deshacer.`)) return;
  setStatus('Eliminando...', '');
  try {
    await api(`/api/catalogos/${current._id}`, { method: 'DELETE' });
    allProducts = allProducts.filter(p => p._id !== current._id);
    renderGrid();
    toast('Producto eliminado');
    showCatalog();
  } catch (err) {
    setStatus(err.message, 'err');
  }
}

/* ── CARGA ── */
async function loadProducts() {
  document.getElementById('countLabel').textContent = 'Cargando...';
  try {
    allProducts = await api('/api/catalogos');
    renderCatBar();
    renderGrid();
  } catch (err) {
    document.getElementById('countLabel').textContent = 'Error al cargar';
  }
}

/* ── EVENTOS ── */
document.getElementById('search').addEventListener('input', e => renderGrid(e.target.value));
document.getElementById('newBtn').addEventListener('click', openNew);
document.getElementById('backBtn').addEventListener('click', showCatalog);
document.getElementById('saveHeaderBtn').addEventListener('click', () => document.getElementById('productForm').requestSubmit());
document.getElementById('deleteHeaderBtn').addEventListener('click', deleteProduct);
document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('lf_admin_token');
  localStorage.removeItem('lf_admin_user');
  window.location.href = 'editar.html';
});

loadProducts();
</script>
