<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Luxury Fernández</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111;
    --muted: #746f68;
    --line: rgba(17,17,17,0.12);
    --paper: #f7f3ec;
    --white: #fff;
    --danger: #b42318;
    --success: #1a7a3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Montserrat, sans-serif; font-size: 13px; }

  /* ── HEADER ── */
  header {
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
    padding: 12px 20px; border-bottom: 1px solid var(--line); background: var(--white);
    position: sticky; top: 0; z-index: 10;
    flex-wrap: wrap;
  }
  h1 { margin: 0; font-family: "Cormorant Garamond", serif; font-size: 26px; line-height: 1; }
  .top-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }

  button, a.btn {
    border: 0; border-radius: 999px; background: var(--ink); color: #fff;
    cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
    padding: 9px 16px; text-decoration: none; white-space: nowrap;
    transition: opacity .15s;
  }
  button:active, a.btn:active { opacity: .75; }
  .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .danger-btn { background: var(--danger); }
  .success-btn { background: var(--success); }
  .new-btn { background: #2a5298; }

  /* ── LAYOUT ── */
  main {
    display: grid;
    grid-template-columns: 300px 1fr;
    height: calc(100vh - 57px);
  }

  /* ── LEFT PANEL ── */
  aside {
    background: var(--white);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .list-header {
    padding: 10px 12px;
    border-bottom: 1px solid var(--line);
  }
  .list-header input {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 13px; padding: 9px 12px;
    outline: none; background: #fafaf8;
  }
  .list-header input:focus { border-color: var(--ink); background: #fff; }
  .product-list { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .product-item {
    display: grid; grid-template-columns: 50px 1fr; gap: 10px; width: 100%;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--ink); padding: 11px 14px;
    text-align: left; cursor: pointer; transition: background .1s;
  }
  .product-item:hover  { background: #f9f6f2; }
  .product-item.active { background: #f0e9df; }
  .product-item.is-deleted { opacity: .4; }
  .product-item.is-hidden  { opacity: .6; }
  .thumb { width: 50px; height: 58px; object-fit: cover; border-radius: 6px; background: #e8e4de; }
  .item-info strong { display: block; font-size: 12px; margin-bottom: 3px; line-height: 1.3; }
  .item-info span   { color: var(--muted); font-size: 11px; }
  .item-badge {
    display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: .5px;
    padding: 2px 6px; border-radius: 999px; margin-left: 4px;
    background: #f5d0ce; color: var(--danger);
  }
  .item-badge.hidden { background: #e0dcd6; color: var(--muted); }

  /* ── RIGHT PANEL ── */
  section { overflow-y: auto; -webkit-overflow-scrolling: touch; }
  .editor { max-width: 680px; padding: 24px 28px; }

  .editor-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px; margin: 0 0 20px;
    display: flex; align-items: center; gap: 10px; flex-wrap: wrap;
  }
  .mode-badge {
    font-family: Montserrat, sans-serif;
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 999px;
    background: #dff0e8; color: var(--success);
  }
  .mode-badge.new-mode { background: #dce8f5; color: #2a5298; }

  /* ── MULTI-IMAGE SLOTS ── */
  .multi-img-section { margin-bottom: 20px; }
  .multi-img-section > .section-label {
    color: var(--muted); font-size: 11px; display: block; margin-bottom: 10px;
  }
  .img-slots {
    display: flex; gap: 8px; overflow-x: auto; padding-bottom: 4px;
  }
  .img-slot-wrap { display: flex; flex-direction: column; gap: 4px; flex-shrink: 0; }
  .img-slot {
    position: relative; width: 88px; height: 104px;
    border: 1.5px dashed var(--muted); border-radius: 8px;
    overflow: hidden; background: #faf8f5;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: border-color .15s;
  }
  .img-slot:hover { border-color: var(--ink); }
  .img-slot.has-img { border: 1.5px solid var(--line); }
  .img-slot img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .slot-placeholder {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 4px; color: var(--muted); font-size: 10px; text-align: center; padding: 6px;
    pointer-events: none;
  }
  .img-slot.has-img .slot-placeholder { display: none; }
  .slot-remove {
    position: absolute; top: 3px; right: 3px;
    width: 18px; height: 18px;
    background: rgba(180,35,24,0.88); color: #fff;
    border: none; border-radius: 50%; font-size: 13px; cursor: pointer;
    display: none; align-items: center; justify-content: center;
    line-height: 1; padding: 0;
  }
  .img-slot.has-img .slot-remove { display: flex; }
  .slot-label { font-size: 9px; color: var(--muted); text-align: center; letter-spacing: 0.3px; }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 13px; padding: 10px 12px;
    outline: none; background: #fff; -webkit-appearance: none;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); }
  .field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }

  .checks { display: flex; gap: 20px; align-items: center; padding: 10px 0; flex-wrap: wrap; }
  .checks label { display: flex; align-items: center; gap: 8px; color: var(--ink); font-size: 13px; cursor: pointer; }
  .checks input[type="checkbox"] { width: 16px; height: 16px; cursor: pointer; }

  .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .form-actions button { flex: 1; min-width: 140px; padding: 12px 16px; font-size: 13px; }
  .status-msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .status-msg.ok  { color: var(--success); font-weight: 600; }
  .status-msg.err { color: var(--danger);  font-weight: 600; }

  .empty-state { padding: 60px 28px; text-align: center; color: var(--muted); }
  .empty-state p { margin: 0 0 20px; font-size: 14px; }

  .count-bar {
    padding: 7px 14px; border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
  }

  /* ── BACK BUTTON (mobile only) ── */
  .back-btn {
    display: none; width: 100%; padding: 12px 16px;
    border: 0; border-radius: 0; border-bottom: 1px solid var(--line);
    background: #f7f3ec; color: var(--muted); font: inherit; font-size: 13px;
    text-align: left; cursor: pointer;
  }

  /* ── STICKY SAVE BAR (mobile only) ── */
  .sticky-save-bar {
    display: none;
  }

  /* ── TABLET ── */
  @media (max-width: 900px) {
    main { grid-template-columns: 260px 1fr; }
    .editor { padding: 18px 20px; }
  }

  /* ── MOBILE ── */
  @media (max-width: 650px) {
    /* Header: stack title on top, buttons below */
    header {
      padding: 10px 14px;
      flex-direction: column;
      align-items: stretch;
      gap: 8px;
    }
    header > div:first-child {
      display: flex; align-items: center; justify-content: space-between;
    }
    h1 { font-size: 21px; }
    .user-line { display: none; }

    /* Button row: Nuevo stretches, Ver catálogo + Salir stay compact */
    .top-actions {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 8px;
    }
    .top-actions .new-btn {
      grid-column: 1 / 2;
      text-align: center;
      padding: 11px 12px;
      font-size: 12px;
    }
    .top-actions .ghost,
    .top-actions .danger-btn {
      padding: 11px 14px;
      font-size: 12px;
    }

    /* Main layout: single column, use dynamic viewport height */
    main {
      grid-template-columns: 1fr;
      grid-template-rows: auto 1fr;
      height: calc(100dvh - var(--hh, 93px));
    }

    aside {
      border-right: none;
      border-bottom: 1px solid var(--line);
      height: calc(100dvh - var(--hh, 93px));
    }
    aside.hidden-mobile { display: none; }

    section { height: calc(100dvh - var(--hh, 93px)); }
    section.hidden-mobile { display: none; }

    .back-btn { display: block; }

    /* Editor form */
    .editor {
      padding: 14px 14px calc(80px + env(safe-area-inset-bottom, 0px));
      max-width: 100%;
    }
    .editor-title { font-size: 18px; margin-bottom: 14px; }

    /* iOS: inputs ≥16px prevent auto-zoom */
    .field input, .field textarea, .field select,
    .list-header input {
      font-size: 16px;
      min-height: 46px;
      padding: 12px 14px;
    }
    .field textarea { min-height: 110px; }

    /* Bigger image slots for touch */
    .img-slot { width: 80px; height: 96px; }

    /* Image slot remove button — bigger tap target */
    .slot-remove { width: 22px; height: 22px; font-size: 15px; }

    .grid { grid-template-columns: 1fr; gap: 14px; }

    .checks { gap: 16px; }
    .checks label { font-size: 14px; }
    .checks input[type="checkbox"] { width: 20px; height: 20px; }

    /* Hide original form-actions; sticky bar replaces them */
    .form-actions { display: none; }
    .status-msg { text-align: center; font-size: 13px; }

    /* Sticky save bar at bottom */
    .sticky-save-bar {
      display: flex; flex-direction: column; gap: 0;
      position: fixed; bottom: 0; left: 0; right: 0; z-index: 20;
      background: var(--white);
      border-top: 1px solid var(--line);
      padding: 10px 14px env(safe-area-inset-bottom, 10px);
    }
    .sticky-save-bar button {
      width: 100%; padding: 14px; font-size: 14px;
      border-radius: 10px;
    }
    .sticky-save-bar .status-msg {
      min-height: 0; padding-top: 6px;
    }

    /* Product list items */
    .product-item { padding: 12px 14px; }
    .thumb { width: 48px; height: 56px; }
    .item-info strong { font-size: 13px; }
    .item-info span { font-size: 12px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Productos</h1>
  </div>
  <div class="top-actions">
    <span id="userLine" class="user-line" style="color:var(--muted);font-size:11px;"></span>
    <button type="button" class="new-btn" id="newBtn">+ Nuevo producto</button>
    <a class="btn ghost" href="/">Ver catálogo</a>
    <button type="button" class="danger-btn" id="logoutBtn">Salir</button>
  </div>
</header>

<main>
  <aside>
    <div class="list-header">
      <input id="search" type="search" placeholder="Buscar...">
    </div>
    <div class="count-bar">
      <span id="countLabel">Cargando...</span>
    </div>
    <div class="product-list" id="productList"></div>
  </aside>

  <section id="editorSection">
    <button class="back-btn" id="backBtn">← Volver a la lista</button>
    <div class="editor" id="editor">
      <div class="empty-state" id="emptyState">
        <p>Selecciona un producto para editarlo</p>
        <button type="button" class="new-btn" onclick="openNew()">+ Nuevo producto</button>
      </div>
      <form id="productForm" style="display:none" onsubmit="submitForm(event)">
        <div class="editor-title">
          <span id="formTitle">Editar producto</span>
          <span class="mode-badge" id="modeBadge">Editando</span>
        </div>

        <div class="multi-img-section">
          <span class="section-label">Imágenes del producto (hasta 5) — toca para subir, × para quitar</span>
          <div class="img-slots" id="imgSlots"></div>
        </div>

        <div class="grid">
          <div class="field">
            <label>Nombre *</label>
            <input type="text" id="fName" required placeholder="Ej: Bolso Cuero Negro">
          </div>
          <div class="field">
            <label>Marca *</label>
            <input type="text" id="fBrand" required placeholder="Ej: Gucci">
          </div>
          <div class="field">
            <label>Categoría</label>
            <select id="fCat">
              <option value="billetera">Billetera</option>
              <option value="cartera">Cartera</option>
              <option value="joya">Joya</option>
              <option value="gorra">Gorra</option>
              <option value="accesorio">Accesorio</option>
              <option value="ropa">Ropa Mujer</option>
              <option value="infantil">Infantil</option>
              <option value="figura">Figura Coleccionable</option>
            </select>
          </div>
          <div class="field">
            <label>Precio</label>
            <input type="text" id="fPrice" placeholder="Ej: $45 o Consultar precio">
          </div>
          <div class="field">
            <label>Etiqueta</label>
            <select id="fTag">
              <option value="">Sin etiqueta</option>
              <option value="nuevo">Nuevo</option>
              <option value="destacado">Destacado</option>
              <option value="exclusivo">Exclusivo</option>
              <option value="oferta">Oferta</option>
              <option value="promocion">Promoción</option>
              <option value="reservado">Reservado</option>
              <option value="vendido">Vendido</option>
            </select>
          </div>
          <div class="field full">
            <label>Descripción</label>
            <textarea id="fDesc" placeholder="Descripción del producto..."></textarea>
          </div>
        </div>

        <div class="checks">
          <label><input type="checkbox" id="fVisible" checked> Visible en catálogo</label>
          <label><input type="checkbox" id="fDeleted"> Marcado como eliminado</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="success-btn" id="submitBtn">Guardar cambios</button>
          <button type="button" class="danger-btn" id="deleteBtn" onclick="deleteProduct()" style="display:none">Eliminar producto</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </section>
</main>

<!-- Sticky save bar – visible only on mobile when form is open -->
<div class="sticky-save-bar" id="stickySaveBar" style="display:none">
  <button type="button" class="success-btn" id="stickySaveBtn">Guardar cambios</button>
  <div class="status-msg" id="stickyStatusMsg"></div>
</div>

<script>
const token = localStorage.getItem('lf_admin_token') || '';
const user  = localStorage.getItem('lf_admin_user') || 'admin';

if (!token) window.location.href = 'editar.html';

document.getElementById('userLine').textContent = `Sesión: ${user}`;

// Measure real header height so CSS custom property --hh is accurate
function updateHeaderHeight() {
  const h = document.querySelector('header').getBoundingClientRect().height;
  document.documentElement.style.setProperty('--hh', Math.round(h) + 'px');
}
updateHeaderHeight();
window.addEventListener('resize', updateHeaderHeight);

let products  = [];
let current   = null;
let isNew     = false;
let slotData  = ['', '', '', '', '']; // up to 5 images per product

function imgSrc(src) {
  if (!src) return '';
  if (/^(https?:|data:)/.test(src)) return src;
  return src.startsWith('/') ? src : `/${src}`;
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`,
      ...(options.headers || {})
    },
    ...options
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error en la solicitud.');
  return data;
}

function renderList(q = '') {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  const lower = q.trim().toLowerCase();
  const filtered = products.filter(p =>
    !lower || [p.name, p.brand, p.cat].some(v => (v || '').toLowerCase().includes(lower))
  );
  document.getElementById('countLabel').textContent =
    `${filtered.length} de ${products.length} productos`;

  filtered.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = [
      'product-item',
      current?._id === p._id ? 'active' : '',
      p.deleted ? 'is-deleted' : '',
      p.hidden && !p.deleted ? 'is-hidden' : ''
    ].filter(Boolean).join(' ');

    const badge = p.deleted
      ? '<span class="item-badge">eliminado</span>'
      : p.hidden ? '<span class="item-badge hidden">oculto</span>' : '';

    btn.innerHTML = `
      <img class="thumb" src="${imgSrc(p.img)}" alt="" onerror="this.style.background='#ddd'">
      <div class="item-info">
        <strong>${p.name || 'Sin nombre'}${badge}</strong>
        <span>${p.brand || ''}${p.price ? ' · ' + p.price : ''}</span>
      </div>`;
    btn.addEventListener('click', () => selectProduct(p));
    list.appendChild(btn);
  });
}

function selectProduct(p) {
  current = p;
  isNew   = false;
  fillForm(p);
  renderList(document.getElementById('search').value);
}

function showStickyBar(show) {
  const bar = document.getElementById('stickySaveBar');
  if (window.innerWidth <= 650) {
    bar.style.display = show ? 'flex' : 'none';
  }
}

function fillForm(p) {
  document.getElementById('emptyState').style.display = 'none';
  const form = document.getElementById('productForm');
  form.style.display = '';
  showStickyBar(true);
  if (window.innerWidth <= 650) {
    document.getElementById('editorSection').classList.remove('hidden-mobile');
    document.querySelector('aside').classList.add('hidden-mobile');
  }

  document.getElementById('formTitle').textContent = isNew ? 'Nuevo producto' : p.name || 'Editar producto';
  const badge = document.getElementById('modeBadge');
  badge.textContent = isNew ? 'Nuevo' : 'Editando';
  badge.className   = 'mode-badge' + (isNew ? ' new-mode' : '');

  const imgArr = (p.images && p.images.length > 0) ? p.images : (p.img ? [p.img] : []);
  slotData = ['', '', '', '', ''];
  imgArr.slice(0, 5).forEach((u, i) => { slotData[i] = u || ''; });
  renderSlots();

  document.getElementById('fName').value    = p.name    || '';
  document.getElementById('fBrand').value   = p.brand   || '';
  document.getElementById('fCat').value     = normCat(p.cat);
  document.getElementById('fPrice').value   = (p.price && p.price !== 'Consultar precio') ? p.price : '';
  document.getElementById('fTag').value     = p.tag     || '';
  document.getElementById('fDesc').value    = p.desc    || '';
  document.getElementById('fVisible').checked  = !p.hidden && !p.deleted;
  document.getElementById('fDeleted').checked  = Boolean(p.deleted);

  document.getElementById('submitBtn').textContent = isNew ? 'Agregar producto' : 'Guardar cambios';
  document.getElementById('deleteBtn').style.display = isNew ? 'none' : '';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('statusMsg').className   = 'status-msg';
}

function openNew() {
  current  = null;
  isNew    = true;
  slotData = ['', '', '', '', ''];
  fillForm({ name: '', brand: '', cat: 'cartera', price: '', tag: '', desc: '', img: '', images: [], hidden: false, deleted: false });
}

function normCat(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('billetera')) return 'billetera';
  if (c.includes('cartera')) return 'cartera';
  if (c.includes('joya'))    return 'joya';
  if (c.includes('gorra'))   return 'gorra';
  if (c.includes('accesorio')) return 'accesorio';
  if (c.includes('ropa'))    return 'ropa';
  if (c.includes('infantil')) return 'infantil';
  if (c.includes('figura'))  return 'figura';
  return c || 'cartera';
}

/* ── IMAGE SLOTS ── */

function renderSlots() {
  const container = document.getElementById('imgSlots');
  container.innerHTML = '';
  slotData.forEach((data, i) => {
    const hasImg = Boolean(data);
    const wrap = document.createElement('div');
    wrap.className = 'img-slot-wrap';

    const slot = document.createElement('div');
    slot.className = 'img-slot' + (hasImg ? ' has-img' : '');

    if (hasImg) {
      const img = document.createElement('img');
      img.src = imgSrc(data);
      img.alt = '';
      slot.appendChild(img);
    }

    const ph = document.createElement('div');
    ph.className = 'slot-placeholder';
    ph.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:18px;height:18px"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg><span>${i === 0 ? 'Principal' : '+'}</span>`;
    slot.appendChild(ph);

    const rm = document.createElement('button');
    rm.type = 'button';
    rm.className = 'slot-remove';
    rm.textContent = '×';
    rm.addEventListener('click', e => { e.stopPropagation(); removeSlotImg(i); });
    slot.appendChild(rm);

    slot.addEventListener('click', () => openSlotInput(i));

    const lbl = document.createElement('div');
    lbl.className = 'slot-label';
    lbl.textContent = i === 0 ? '★ Principal' : `Foto ${i + 1}`;

    wrap.appendChild(slot);
    wrap.appendChild(lbl);
    container.appendChild(wrap);
  });
}

function removeSlotImg(i) {
  slotData[i] = '';
  renderSlots();
}

function openSlotInput(i) {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = 'image/*';
  input.style.display = 'none';
  document.body.appendChild(input);
  input.addEventListener('change', async e => {
    const file = e.target.files[0];
    document.body.removeChild(input);
    if (!file) return;
    status('Procesando imagen...', '');
    slotData[i] = await resizeImage(file);
    renderSlots();
    status('', '');
  });
  input.click();
}

async function resizeImage(file, maxWidth = 900, quality = 0.75) {
  return new Promise(resolve => {
    const reader = new FileReader();
    reader.onload = e => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        resolve(canvas.toDataURL('image/jpeg', quality));
      };
      img.src = e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

function status(msg, type = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className   = 'status-msg ' + type;
}

async function submitForm(event) {
  event.preventDefault();
  const images = slotData.filter(Boolean);
  const name   = document.getElementById('fName').value.trim();
  const brand  = document.getElementById('fBrand').value.trim();

  if (!name || !brand)     { status('Nombre y marca son obligatorios.', 'err'); return; }
  if (isNew && !images[0]) { status('La imagen principal es obligatoria para productos nuevos.', 'err'); return; }

  const visible  = document.getElementById('fVisible').checked;
  const deleted  = document.getElementById('fDeleted').checked;

  const payload = {
    name,
    brand,
    cat:     document.getElementById('fCat').value,
    price:   document.getElementById('fPrice').value.trim() || 'Consultar precio',
    tag:     document.getElementById('fTag').value,
    desc:    document.getElementById('fDesc').value.trim(),
    hidden:  !visible,
    deleted,
    img:     images[0] || (current?.img || ''),
    images
  };

  status('Guardando...', '');

  try {
    let saved;
    if (isNew) {
      saved = await api('/api/catalogos', { method: 'POST', body: JSON.stringify({ ...payload, isCustom: true }) });
      products.unshift(saved);
      current = saved;
      isNew   = false;
    } else {
      const endpoint = current.sourceId !== undefined
        ? `/api/catalogos/source/${current.sourceId}`
        : `/api/catalogos/${current._id}`;
      const method = current.sourceId !== undefined ? 'PUT' : 'PUT';
      saved = await api(endpoint, { method, body: JSON.stringify(payload) });
      products = products.map(p => p._id === saved._id ? saved : p);
      current = saved;
    }
    fillForm(saved);
    renderList(document.getElementById('search').value);
    status('Cambios guardados correctamente.', 'ok');
  } catch (err) {
    status(err.message, 'err');
  }
}

async function deleteProduct() {
  if (!current || isNew) return;
  const name = current.name || 'este producto';
  if (!confirm(`¿Eliminar permanentemente "${name}"?\n\nEsta acción no se puede deshacer.`)) return;

  status('Eliminando...', '');
  try {
    await api(`/api/catalogos/${current._id}`, { method: 'DELETE' });
    products = products.filter(p => p._id !== current._id);
    current  = null;
    isNew    = false;
    document.getElementById('productForm').style.display = 'none';
    document.getElementById('emptyState').style.display  = '';
    showStickyBar(false);
    renderList(document.getElementById('search').value);
    status('', '');
  } catch (err) {
    status(err.message, 'err');
  }
}

async function loadProducts() {
  status('Cargando productos...', '');
  try {
    products = await api('/api/catalogos');
    renderList();
    status('', '');
  } catch (err) {
    status(err.message, 'err');
  }
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

document.getElementById('newBtn').addEventListener('click', openNew);

document.getElementById('backBtn').addEventListener('click', () => {
  document.getElementById('editorSection').classList.add('hidden-mobile');
  document.querySelector('aside').classList.remove('hidden-mobile');
  showStickyBar(false);
});

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('lf_admin_token');
  localStorage.removeItem('lf_admin_user');
  window.location.href = 'editar.html';
});

// Sticky save bar – submit the form and mirror status message
document.getElementById('stickySaveBtn').addEventListener('click', () => {
  document.getElementById('productForm').requestSubmit();
});

// Mirror statusMsg to stickyStatusMsg so user sees feedback above keyboard
const statusObserver = new MutationObserver(() => {
  const src = document.getElementById('statusMsg');
  const dst = document.getElementById('stickyStatusMsg');
  dst.textContent = src.textContent;
  dst.className   = src.className;
});
statusObserver.observe(document.getElementById('statusMsg'), { childList: true, characterData: true, subtree: true });


loadProducts();
</script>
