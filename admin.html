<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Luxury Fernández</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500&family=Montserrat:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --ink: #111;
    --muted: #746f68;
    --line: rgba(17,17,17,0.12);
    --paper: #f7f3ec;
    --white: #fff;
    --danger: #b42318;
    --success: #1a7a3f;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font-family: Montserrat, sans-serif; font-size: 13px; }

  header {
    display: flex; align-items: center; justify-content: space-between; gap: 16px;
    padding: 16px 22px; border-bottom: 1px solid var(--line); background: var(--white);
    position: sticky; top: 0; z-index: 5;
  }
  h1 { margin: 0; font-family: "Cormorant Garamond", serif; font-size: 28px; line-height: 1; }
  .top-actions { display: flex; gap: 8px; align-items: center; }

  button, a.btn {
    border: 0; border-radius: 999px; background: var(--ink); color: #fff;
    cursor: pointer; font: inherit; font-size: 12px; font-weight: 600;
    padding: 9px 16px; text-decoration: none; white-space: nowrap;
  }
  .ghost { background: #fff; color: var(--ink); border: 1px solid var(--line); }
  .danger-btn { background: var(--danger); }
  .success-btn { background: var(--success); }
  .new-btn { background: #2a5298; }

  main {
    display: grid;
    grid-template-columns: minmax(240px, 320px) 1fr;
    gap: 0;
    height: calc(100vh - 61px);
  }

  /* LEFT PANEL */
  aside {
    background: var(--white);
    border-right: 1px solid var(--line);
    display: flex; flex-direction: column;
    overflow: hidden;
  }
  .list-header {
    padding: 12px 14px;
    border-bottom: 1px solid var(--line);
    display: flex; gap: 8px; align-items: center;
  }
  .list-header input {
    flex: 1; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 12px; padding: 8px 10px;
    outline: none; background: #fff;
  }
  .list-header input:focus { border-color: var(--ink); }
  .product-list { flex: 1; overflow-y: auto; }
  .product-item {
    display: grid; grid-template-columns: 46px 1fr; gap: 10px; width: 100%;
    border: 0; border-bottom: 1px solid var(--line); border-radius: 0;
    background: transparent; color: var(--ink); padding: 10px 14px;
    text-align: left; cursor: pointer;
  }
  .product-item:hover { background: #f9f6f2; }
  .product-item.active { background: #f0e9df; }
  .product-item.is-deleted { opacity: 0.4; }
  .product-item.is-hidden { opacity: 0.6; }
  .thumb { width: 46px; height: 54px; object-fit: cover; border-radius: 5px; background: #e8e4de; }
  .item-info strong { display: block; font-size: 12px; margin-bottom: 2px; }
  .item-info span { color: var(--muted); font-size: 11px; }
  .item-badge {
    display: inline-block; font-size: 9px; font-weight: 600; letter-spacing: 0.5px;
    padding: 2px 6px; border-radius: 999px; margin-left: 4px;
    background: #f5d0ce; color: var(--danger);
  }
  .item-badge.hidden { background: #e0dcd6; color: var(--muted); }

  /* RIGHT PANEL */
  section {
    overflow-y: auto;
    padding: 0;
  }
  .editor {
    max-width: 640px;
    padding: 24px 28px;
  }
  .editor-title {
    font-family: "Cormorant Garamond", serif;
    font-size: 22px; margin: 0 0 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .editor-title .mode-badge {
    font-family: Montserrat, sans-serif;
    font-size: 10px; font-weight: 600; letter-spacing: 1px;
    padding: 3px 10px; border-radius: 999px;
    background: #dff0e8; color: var(--success);
  }
  .editor-title .mode-badge.new-mode { background: #dce8f5; color: #2a5298; }

  .img-section {
    display: flex; gap: 16px; align-items: flex-start; margin-bottom: 20px;
  }
  .preview {
    width: 110px; height: 130px; object-fit: cover;
    border-radius: 8px; border: 1px solid var(--line); background: #e8e4de;
    flex-shrink: 0;
  }
  .img-controls { flex: 1; display: flex; flex-direction: column; gap: 8px; }
  .img-controls label { color: var(--muted); font-size: 11px; margin-bottom: 2px; display: block; }
  .img-controls input[type="text"] {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 12px; padding: 9px 11px; outline: none;
  }
  .img-controls input[type="text"]:focus { border-color: var(--ink); }
  .file-btn {
    display: inline-block; border: 1px dashed var(--muted); border-radius: 8px;
    padding: 8px 12px; font-size: 11px; color: var(--muted); cursor: pointer;
    text-align: center; background: #faf8f5;
  }
  .file-btn:hover { border-color: var(--ink); color: var(--ink); }

  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 14px; }
  .field.full { grid-column: 1 / -1; }
  .field label { display: block; color: var(--muted); font-size: 11px; margin-bottom: 6px; }
  .field input, .field textarea, .field select {
    width: 100%; border: 1px solid var(--line); border-radius: 8px;
    color: var(--ink); font: inherit; font-size: 13px; padding: 10px 12px;
    outline: none; background: #fff;
  }
  .field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ink); }
  .field textarea { min-height: 100px; resize: vertical; line-height: 1.5; }

  .checks {
    display: flex; gap: 20px; align-items: center; padding: 8px 0;
  }
  .checks label { display: flex; align-items: center; gap: 7px; color: var(--ink); font-size: 12px; cursor: pointer; }
  .checks input[type="checkbox"] { width: auto; }

  .form-actions { display: flex; gap: 10px; margin-top: 20px; flex-wrap: wrap; }
  .status-msg { margin-top: 10px; font-size: 12px; color: var(--muted); min-height: 18px; }
  .status-msg.ok { color: var(--success); }
  .status-msg.err { color: var(--danger); }

  .empty-state {
    padding: 60px 28px; text-align: center; color: var(--muted);
  }
  .empty-state p { margin: 0 0 20px; font-size: 14px; }

  .count-bar {
    padding: 8px 14px;
    border-bottom: 1px solid var(--line);
    color: var(--muted); font-size: 11px;
    display: flex; justify-content: space-between; align-items: center;
  }

  @media (max-width: 820px) {
    header { flex-direction: column; align-items: flex-start; }
    main { grid-template-columns: 1fr; height: auto; }
    aside { max-height: 40vh; }
    .editor { padding: 16px; }
    .grid { grid-template-columns: 1fr; }
    .img-section { flex-direction: column; }
    .preview { width: 100%; height: 200px; }
  }
</style>
</head>
<body>

<header>
  <div>
    <h1>Productos</h1>
  </div>
  <div class="top-actions">
    <span id="userLine" style="color:var(--muted);font-size:11px;"></span>
    <button type="button" class="new-btn" id="newBtn">+ Nuevo producto</button>
    <a class="btn ghost" href="/">Ver catálogo</a>
    <button type="button" class="danger-btn" id="logoutBtn">Salir</button>
  </div>
</header>

<main>
  <aside>
    <div class="list-header">
      <input id="search" type="search" placeholder="Buscar...">
    </div>
    <div class="count-bar">
      <span id="countLabel">Cargando...</span>
    </div>
    <div class="product-list" id="productList"></div>
  </aside>

  <section>
    <div class="editor" id="editor">
      <div class="empty-state" id="emptyState">
        <p>Selecciona un producto para editarlo</p>
        <button type="button" class="new-btn" onclick="openNew()">+ Nuevo producto</button>
      </div>
      <form id="productForm" style="display:none" onsubmit="submitForm(event)">
        <div class="editor-title">
          <span id="formTitle">Editar producto</span>
          <span class="mode-badge" id="modeBadge">Editando</span>
        </div>

        <div class="img-section">
          <img class="preview" id="preview" src="" alt="">
          <div class="img-controls">
            <div>
              <label>URL de imagen</label>
              <input type="text" id="imgUrl" placeholder="https://... o imagenes/archivo.JPG" oninput="onImgUrlChange()">
            </div>
            <label class="file-btn">
              📷 Subir imagen desde dispositivo
              <input type="file" id="imgFile" accept="image/*" style="display:none" onchange="onImgFileChange(event)">
            </label>
          </div>
        </div>

        <div class="grid">
          <div class="field">
            <label>Nombre *</label>
            <input type="text" id="fName" required placeholder="Ej: Bolso Cuero Negro">
          </div>
          <div class="field">
            <label>Marca *</label>
            <input type="text" id="fBrand" required placeholder="Ej: Gucci">
          </div>
          <div class="field">
            <label>Categoría</label>
            <select id="fCat">
              <option value="cartera">Cartera</option>
              <option value="joya">Joya</option>
              <option value="gorra">Gorra</option>
              <option value="accesorio">Accesorio</option>
              <option value="ropa">Ropa Mujer</option>
              <option value="infantil">Infantil</option>
              <option value="figura">Figura Coleccionable</option>
            </select>
          </div>
          <div class="field">
            <label>Precio</label>
            <input type="text" id="fPrice" placeholder="Ej: $45 o Consultar precio">
          </div>
          <div class="field">
            <label>Etiqueta</label>
            <select id="fTag">
              <option value="">Sin etiqueta</option>
              <option value="nuevo">Nuevo</option>
              <option value="destacado">Destacado</option>
              <option value="exclusivo">Exclusivo</option>
              <option value="oferta">Oferta</option>
              <option value="promocion">Promoción</option>
              <option value="reservado">Reservado</option>
              <option value="vendido">Vendido</option>
            </select>
          </div>
          <div class="field full">
            <label>Descripción</label>
            <textarea id="fDesc" placeholder="Descripción del producto..."></textarea>
          </div>
        </div>

        <div class="checks">
          <label><input type="checkbox" id="fVisible" checked> Visible en catálogo</label>
          <label><input type="checkbox" id="fDeleted"> Marcado como eliminado</label>
        </div>

        <div class="form-actions">
          <button type="submit" class="success-btn" id="submitBtn">Guardar cambios</button>
          <button type="button" class="danger-btn" id="deleteBtn" onclick="deleteProduct()" style="display:none">Eliminar producto</button>
        </div>
        <div class="status-msg" id="statusMsg"></div>
      </form>
    </div>
  </section>
</main>

<script>
const token = localStorage.getItem('lf_admin_token') || '';
const user  = localStorage.getItem('lf_admin_user') || 'admin';

if (!token) window.location.href = 'editar.html';

document.getElementById('userLine').textContent = `Sesión: ${user}`;

let products = [];
let current  = null;
let isNew    = false;
let tempImg  = null;

function imgSrc(src) {
  if (!src) return '';
  if (/^(https?:|data:)/.test(src)) return src;
  return src.startsWith('/') ? src : `/${src}`;
}

async function api(path, options = {}) {
  const res = await fetch(path, {
    headers: {
      'Content-Type': 'application/json',
      Authorization: `Bearer ${token}`,
      ...(options.headers || {})
    },
    ...options
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || 'Error en la solicitud.');
  return data;
}

function renderList(q = '') {
  const list = document.getElementById('productList');
  list.innerHTML = '';
  const lower = q.trim().toLowerCase();
  const filtered = products.filter(p =>
    !lower || [p.name, p.brand, p.cat].some(v => (v || '').toLowerCase().includes(lower))
  );
  document.getElementById('countLabel').textContent =
    `${filtered.length} de ${products.length} productos`;

  filtered.forEach(p => {
    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = [
      'product-item',
      current?._id === p._id ? 'active' : '',
      p.deleted ? 'is-deleted' : '',
      p.hidden && !p.deleted ? 'is-hidden' : ''
    ].filter(Boolean).join(' ');

    const badge = p.deleted
      ? '<span class="item-badge">eliminado</span>'
      : p.hidden ? '<span class="item-badge hidden">oculto</span>' : '';

    btn.innerHTML = `
      <img class="thumb" src="${imgSrc(p.img)}" alt="" onerror="this.style.background='#ddd'">
      <div class="item-info">
        <strong>${p.name || 'Sin nombre'}${badge}</strong>
        <span>${p.brand || ''}${p.price ? ' · ' + p.price : ''}</span>
      </div>`;
    btn.addEventListener('click', () => selectProduct(p));
    list.appendChild(btn);
  });
}

function selectProduct(p) {
  current = p;
  isNew   = false;
  fillForm(p);
  renderList(document.getElementById('search').value);
}

function fillForm(p) {
  document.getElementById('emptyState').style.display = 'none';
  const form = document.getElementById('productForm');
  form.style.display = '';

  document.getElementById('formTitle').textContent = isNew ? 'Nuevo producto' : p.name || 'Editar producto';
  const badge = document.getElementById('modeBadge');
  badge.textContent = isNew ? 'Nuevo' : 'Editando';
  badge.className   = 'mode-badge' + (isNew ? ' new-mode' : '');

  document.getElementById('preview').src  = isNew ? '' : imgSrc(p.img);
  document.getElementById('imgUrl').value  = isNew ? '' : (p.img || '');
  document.getElementById('imgFile').value = '';
  tempImg = null;

  document.getElementById('fName').value    = p.name    || '';
  document.getElementById('fBrand').value   = p.brand   || '';
  document.getElementById('fCat').value     = normCat(p.cat);
  document.getElementById('fPrice').value   = (p.price && p.price !== 'Consultar precio') ? p.price : '';
  document.getElementById('fTag').value     = p.tag     || '';
  document.getElementById('fDesc').value    = p.desc    || '';
  document.getElementById('fVisible').checked  = !p.hidden && !p.deleted;
  document.getElementById('fDeleted').checked  = Boolean(p.deleted);

  document.getElementById('submitBtn').textContent = isNew ? 'Agregar producto' : 'Guardar cambios';
  document.getElementById('deleteBtn').style.display = isNew ? 'none' : '';
  document.getElementById('statusMsg').textContent = '';
  document.getElementById('statusMsg').className   = 'status-msg';
}

function openNew() {
  current = null;
  isNew   = true;
  fillForm({ name: '', brand: '', cat: 'cartera', price: '', tag: '', desc: '', img: '', hidden: false, deleted: false });
}

function normCat(cat) {
  const c = (cat || '').toLowerCase();
  if (c.includes('cartera')) return 'cartera';
  if (c.includes('joya'))    return 'joya';
  if (c.includes('gorra'))   return 'gorra';
  if (c.includes('accesorio')) return 'accesorio';
  if (c.includes('ropa'))    return 'ropa';
  if (c.includes('infantil')) return 'infantil';
  if (c.includes('figura'))  return 'figura';
  return c || 'cartera';
}

function onImgUrlChange() {
  tempImg = null;
  document.getElementById('imgFile').value = '';
  const url = document.getElementById('imgUrl').value.trim();
  document.getElementById('preview').src = imgSrc(url);
}

function onImgFileChange(event) {
  const file = event.target.files[0];
  if (!file) return;
  document.getElementById('imgUrl').value = '';
  const reader = new FileReader();
  reader.onload = e => {
    tempImg = e.target.result;
    document.getElementById('preview').src = tempImg;
  };
  reader.readAsDataURL(file);
}

function status(msg, type = '') {
  const el = document.getElementById('statusMsg');
  el.textContent = msg;
  el.className   = 'status-msg ' + type;
}

async function submitForm(event) {
  event.preventDefault();
  const imgVal = tempImg || document.getElementById('imgUrl').value.trim();
  const name   = document.getElementById('fName').value.trim();
  const brand  = document.getElementById('fBrand').value.trim();

  if (!name || !brand)  { status('Nombre y marca son obligatorios.', 'err'); return; }
  if (isNew && !imgVal) { status('La imagen es obligatoria para productos nuevos.', 'err'); return; }

  const visible  = document.getElementById('fVisible').checked;
  const deleted  = document.getElementById('fDeleted').checked;

  const payload = {
    name,
    brand,
    cat:     document.getElementById('fCat').value,
    price:   document.getElementById('fPrice').value.trim() || 'Consultar precio',
    tag:     document.getElementById('fTag').value,
    desc:    document.getElementById('fDesc').value.trim(),
    hidden:  !visible,
    deleted,
    img:     imgVal || (current?.img || '')
  };

  status('Guardando...', '');

  try {
    let saved;
    if (isNew) {
      saved = await api('/api/catalogos', { method: 'POST', body: JSON.stringify({ ...payload, isCustom: true }) });
      products.unshift(saved);
      current = saved;
      isNew   = false;
    } else {
      const endpoint = current.sourceId !== undefined
        ? `/api/catalogos/source/${current.sourceId}`
        : `/api/catalogos/${current._id}`;
      const method = current.sourceId !== undefined ? 'PUT' : 'PUT';
      saved = await api(endpoint, { method, body: JSON.stringify(payload) });
      products = products.map(p => p._id === saved._id ? saved : p);
      current = saved;
    }
    fillForm(saved);
    renderList(document.getElementById('search').value);
    status('Cambios guardados correctamente.', 'ok');
  } catch (err) {
    status(err.message, 'err');
  }
}

async function deleteProduct() {
  if (!current || isNew) return;
  const name = current.name || 'este producto';
  if (!confirm(`¿Eliminar permanentemente "${name}"?\n\nEsta acción no se puede deshacer.`)) return;

  status('Eliminando...', '');
  try {
    await api(`/api/catalogos/${current._id}`, { method: 'DELETE' });
    products = products.filter(p => p._id !== current._id);
    current  = null;
    isNew    = false;
    document.getElementById('productForm').style.display = 'none';
    document.getElementById('emptyState').style.display  = '';
    renderList(document.getElementById('search').value);
    status('', '');
  } catch (err) {
    status(err.message, 'err');
  }
}

async function loadProducts() {
  status('Cargando productos...', '');
  try {
    products = await api('/api/catalogos');
    renderList();
    status('', '');
  } catch (err) {
    status(err.message, 'err');
  }
}

document.getElementById('search').addEventListener('input', e => renderList(e.target.value));

document.getElementById('newBtn').addEventListener('click', openNew);

document.getElementById('logoutBtn').addEventListener('click', () => {
  localStorage.removeItem('lf_admin_token');
  localStorage.removeItem('lf_admin_user');
  window.location.href = 'editar.html';
});

loadProducts();
</script>
</body>
</html>
